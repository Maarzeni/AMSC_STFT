name: AMSC_STFT CI/CD Pipeline

on: [push, pull_request]

jobs:
  # ─────────────────────────────────────────────────
  # TASK 1 + 2: Continuous Integration
  # Executes tests and builds the Singularity container image
  # ─────────────────────────────────────────────────
  ci:
    # Use Ubuntu 22.04 to ensure we have a modern GCC version (11+) for C++20 TODO: ubuntu latest?
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Downloads the repository code inside the Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: [Setup] Install C++ HPC dependencies (CMake, OpenMP, OpenMPI)
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          cat system-deps.txt | grep -v '^#' | xargs sudo apt-get install -y

      # Step 3: [Build] Configure and compile the C++ project
      - name: Build Project with CMake
        run: |
          cd core
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      # Step 4: [Test] Execute the test suite using CTest
      - name: Run test suite with CTest
        run: |
          cd core/build
          # OMPI_MCA_rmaps_base_oversubscribe=1 allows MPI to run more processes than physical cores
          export OMPI_MCA_rmaps_base_oversubscribe=1
          export OMP_NUM_THREADS=2
          ctest --output-on-failure

      # Step 5: [Benchmark] Run the suite on the runner.
      # These numbers are a SMOKE TEST, not a measurement: GitHub runners are
      # shared vCPUs with no exclusive access, so absolute timings are noisy and
      # not comparable with the cluster ones. What they do catch is a benchmark
      # that stopped building, crashed, or lost its parallel speedup entirely.
      # Parameters are kept identical to job.sh so the two tables line up.
      - name: Run benchmarks on GitHub runner
        env:
          # Same rank x thread layout as the SLURM job. Everything else the
          # script decides for itself; scripts/run_suite.sh is the one place
          # where the benchmark parameters are defined, shared by this runner,
          # the cluster job and any manual run.
          RANKS: 2
          THREADS: 2
          RESULTS_DIR: ${{ github.workspace }}/results
        run: bash scripts/run_suite.sh

      # Step 6: [Artifact] Publish the runner-side benchmark output
      - name: Upload GitHub benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-github
          path: results/
          retention-days: 30

      # Step 7: [Apptainer] Install Apptainer to build the container
      - name: Install Apptainer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq
          sudo apt-get install -y apptainer

      # Step 8: [Container] Build Singularity container image
      - name: Build Singularity container image
        run: sudo apptainer build --force amsc_stft.sif Singularity.def

      # Step 9: [Artifact] Save the built container to be downloaded later
      - name: Upload container artifact
        uses: actions/upload-artifact@v4
        with:
          name: amsc-stft-sif
          path: amsc_stft.sif
          retention-days: 7

  # ─────────────────────────────────────────────────
  # TASK 3 + 4: Continuous Deployment
  # Deploy on Galileo100 and submit the SLURM job
  # NOTE: This job depends on the successful completion of the 'ci' job, ensuring that deployment only occurs if tests pass and the container is built correctly.
  # ─────────────────────────────────────────────────
  cd:
    needs: ci
    runs-on: ubuntu-latest # TODO: 22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: amsc-stft-sif

      # Configures SSH access to the Galileo100 cluster using the provided secrets
      - name: Configure SSH access to Galileo100
        run: |
          mkdir -p ~/.ssh
          
          # Stores the private key in a neutral filename
          echo "${{ secrets.HPC_SSH_PRIVATE_KEY }}" > ~/.ssh/cineca_key
          chmod 600 ~/.ssh/cineca_key
          
          # Stores the SSH certificate
          echo "${{ secrets.HPC_CERT }}" > ~/.ssh/cineca_key-cert.pub
          chmod 644 ~/.ssh/cineca_key-cert.pub

      # Transfers necessary files (container, script, input data) to the Galileo100 cluster using scp
      - name: Deploy files to Galileo100 scratch
        env:
          REMOTE_USER: ${{ secrets.HPC_USERNAME }}
          REMOTE_PATH: ${{ secrets.HPC_SCRATCH_PATH }}
          SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
        run: |
          REMOTE="${REMOTE_USER}@login.g100.cineca.it"

          # Creates the required folder structure on the cluster. `results` is
          # wiped first: it is fetched back after the run, and leftovers from a
          # previous job would be published as if they belonged to this one.
          ssh $SSH_OPTS ${REMOTE} \
            "mkdir -p ${REMOTE_PATH}/input && rm -rf ${REMOTE_PATH}/results && mkdir -p ${REMOTE_PATH}/results"

          # Copies the container and the scripts directory, which carries both
          # the SLURM script and the shared benchmark suite it runs inside the
          # container — one copy, so the two can never arrive out of step.
          scp $SSH_OPTS amsc_stft.sif  ${REMOTE}:${REMOTE_PATH}/
          scp -r $SSH_OPTS scripts         ${REMOTE}:${REMOTE_PATH}/

      # Submits the SLURM job and blocks until it finishes.
      # --wait is what makes the results retrievable: without it sbatch returns
      # as soon as the job is queued, the workflow ends, and there is nothing to
      # download. The ServerAlive options keep the SSH connection from being
      # dropped while the job sits in the queue.
      - name: Submit SLURM job via sbatch and wait for completion
        timeout-minutes: 60
        env:
          SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=30"
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.HPC_USERNAME }}@login.g100.cineca.it \
            "cd ${{ secrets.HPC_SCRATCH_PATH }} && sbatch --wait scripts/job.sh"

      # Brings the benchmark output back from the cluster.
      # `always()` so that a failed or timed-out job still yields its logs —
      # that is exactly when they are most worth reading.
      - name: Fetch results from Galileo100
        if: always()
        env:
          REMOTE_USER: ${{ secrets.HPC_USERNAME }}
          REMOTE_PATH: ${{ secrets.HPC_SCRATCH_PATH }}
          SSH_OPTS: "-i ~/.ssh/cineca_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
        run: |
          REMOTE="${REMOTE_USER}@login.g100.cineca.it"
          mkdir -p results

          # Per-step logs written by job.sh
          scp -r $SSH_OPTS ${REMOTE}:${REMOTE_PATH}/results/. results/ || \
            echo "WARNING: no results/ directory on the cluster"

          # SLURM's own stdout/stderr capture, useful when the job died early
          scp $SSH_OPTS ${REMOTE}:${REMOTE_PATH}/amsc_stft_job.out results/ || true
          scp $SSH_OPTS ${REMOTE}:${REMOTE_PATH}/amsc_stft_job.err results/ || true

          echo "Fetched:"
          ls -la results/

      - name: Upload cluster benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-cluster
          path: results/
          retention-days: 30